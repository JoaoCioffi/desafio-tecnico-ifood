name: sabor-da-maria

services:
  postgres:
    image: postgres:16-alpine
    container_name: sabor-da-maria-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: sabor_da_maria
      # Evita recriar o cluster a cada up quando o volume ja existe.
      PGDATA: /var/lib/postgresql/data/pgdata
      TZ: America/Sao_Paulo

    ports:
      - "5432:5432"

    volumes:
      # Volume nomeado do Docker: os dados NAO ficam na pasta do repo,
      # entao quem clonar recebe um banco vazio, carregado so pelo ETL.
      - pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d sabor_da_maria"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

volumes:
  pgdata:
    name: sabor-da-maria-pgdata
