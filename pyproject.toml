[project]
name = "sabor-da-maria"
version = "0.1.0"
description = "Agente consultora de cardapio e precificacao para a Dona Maria — desafio tecnico iFood"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "colorama>=0.4.6",          # terminal do run_services
    "fastmcp>=4.0",             # servidor MCP
    "openpyxl>=3.1",            # leitura da planilha
    "psutil>=6.0",              # metricas de host no painel
    "psycopg[binary,pool]>=3.2", # Postgres
    "pyyaml>=6.0",              # merge do config do Hermes
]

# Extra (nao dependency-group): assim `pip install -e ".[dev]"` e
# `uv pip install -e ".[dev]"` funcionam igual. Com [dependency-groups] o
# `[dev]` seria ignorado com um aviso, e o pytest nao viria.
[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
sabor-mcp = "mcp_server.__main__:main"

# --------------------------------------------------------------------------- #
# Build
# --------------------------------------------------------------------------- #
# `sources` faz o hatchling tratar src/backend como raiz: os pacotes ficam
# importaveis como `domain` e `mcp_server`, sem prefixo. E o que permite
# rodar `python -m mcp_server` e `pytest` de qualquer diretorio.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src/backend"]
packages = ["src/backend/domain", "src/backend/mcp_server", "src/backend/api"]

# --------------------------------------------------------------------------- #
# Testes
# --------------------------------------------------------------------------- #
[tool.pytest.ini_options]
testpaths = ["src/backend/tests", "src/backend/domain"]
addopts = "--doctest-modules -q"
pythonpath = ["src/backend"]
