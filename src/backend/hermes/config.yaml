# Customizacoes do Hermes para o Sabor da Maria.
#
# Este arquivo NAO substitui o config.yaml do Hermes — ele e o nosso DELTA.
# O install.py funde estas chaves no ~/.hermes/config.yaml preservando todo
# o resto (o arquivo original tem centenas de defaults).

# --------------------------------------------------------------------------- #
# Modelo
#
# Provider e modelo saem do .env da raiz — o install.py materializa aqui.
# Nao ha valor fixo neste arquivo de proposito: chave de API nao se versiona,
# e o modelo muda sem tocar em codigo.
#
# ATENCAO ao nome do provider: o Hermes NAO conhece "openai". O endpoint da
# OpenAI atende por `openai-api` (ha tambem `openai-codex`, para outro
# caminho). O nome errado so falha na primeira chamada de verdade.
# --------------------------------------------------------------------------- #

# --------------------------------------------------------------------------- #
# Diretorio do projeto
#
# O Hermes descobre o AGENTS.md a partir DESTE caminho, e ele precisa ser
# absoluto. Com "." a descoberta cai no diretorio de lancamento do
# hermes.exe — que nao e o repositorio — e o arquivo de regras simplesmente
# nao entra no prompt. Nao ha erro, nada no log: o agente so responde sem
# conhecer nenhuma regra do projeto.
#
# Foi medido: 9,5 mil tokens de system prompt sem ele, 11,9 mil com ele. A
# diferenca e o AGENTS.md inteiro.
#
# O install.py troca o "." pelo caminho absoluto desta maquina — e por isso
# que a instalacao e um passo de setup, e nao um copiar-e-colar de config.
# --------------------------------------------------------------------------- #
terminal:
  cwd: "."

# --------------------------------------------------------------------------- #
# Raciocinio
#
# Desligado. Num loop agentico o raciocinio e pago a CADA rodada, e a decisao
# de qual ferramenta chamar nao precisa dele: o schema da ferramenta ja diz o
# que ela aceita, e a recusa do servidor ja diz o que falta.
# --------------------------------------------------------------------------- #
agent:
  reasoning_effort: none

# --------------------------------------------------------------------------- #
# Toolsets
#
# O default `hermes-cli` liga 20 tools e gera 35 KB de schema — reenviados a
# cada rodada. Nenhuma marmita precisa de navegador, terminal, TTS ou geracao
# de imagem.
#
# ATENCAO: cada servidor MCP vira um toolset chamado `mcp-<nome>`
# (toolsets.py:286). Omitir essa linha faz nossas 9 ferramentas sumirem em
# silencio — o agente conversa e nao consegue fazer nada.
# --------------------------------------------------------------------------- #
platform_toolsets:
  cli:
    - mcp-sabor-da-maria   # as 11 tools do dominio
    - web                  # web_search + web_extract — o requisito 2.1 exige
    - memory               # o que a Dona Maria contou, entre sessoes
    - delegation           # delegate_task — os workers
    - clarify              # perguntar a ela de forma estruturada

  # `skills` esta FORA de proposito. O toolset entrega skill_view junto com
  # skill_manage, e nao da para separar: o agente passou a criar skill para
  # guardar rascunho. Criou duas — `feijoada-pratica` (com "author: Nestle",
  # copiado da receita) e `prato_salvar`. Uma skill por prato nao escala e nao
  # e para isso que skill serve.
  #
  # O que ele lia ali agora esta no AGENTS.md, que carrega em toda sessao sem
  # depender de ele decidir abrir. As skills continuam versionadas no repo
  # como documentacao do desenho.

# --------------------------------------------------------------------------- #
# Descoberta de ferramentas
#
# Por padrao o Hermes ESCONDE parte das tools do modelo e obriga a chama-las
# por um wrapper `tool_call(name=..., arguments=...)`. E o desenho certo para
# quem tem dezenas de tools e nao cabe tudo no prompt.
#
# Aqui custa caro e nao compra nada. Medido numa rodada real, o modelo levou
# TRES tentativas ate acertar uma unica consulta a despensa:
#
#   1. sabor-da-maria__despensa        -> nome errado, nao e deferrable
#   2. mcp__sabor_da_maria__despensa   -> nome certo, argumento inventado
#   3. mcp__sabor_da_maria__despensa   -> enfim
#
# Duas rodadas de modelo jogadas fora por ferramenta. Ja cortamos os toolsets
# justamente para caber tudo direto no prompt — entao desligamos o wrapper e
# o modelo chama pelo nome.
# --------------------------------------------------------------------------- #
tools:
  tool_search:
    enabled: "off"

# --------------------------------------------------------------------------- #
# Delegacao
#
# UM filho por vez.
#
# Delegar nao compra paralelismo aqui — compra CONTEXTO LIMPO no filho, que e
# o que faz o trabalho sair feito em vez de narrado. Um worker de cada vez
# preserva esse ganho e mantem a ordem dos passos previsivel, que e o que o
# gate depende para nao ser pulado.
#
# Medido com dois workers concorrentes: 1300 s e banco vazio. Em serie: 694 s
# com tudo gravado.
# --------------------------------------------------------------------------- #
delegation:
  max_concurrent_children: 1
  max_spawn_depth: 1
  orchestrator_enabled: true

# --------------------------------------------------------------------------- #
# Ferramentas do dominio, servidas pelo nosso MCP.
# Lista explicita: o agente enxerga so o que precisa.
# --------------------------------------------------------------------------- #
mcp_servers:
  sabor-da-maria:
    url: http://127.0.0.1:9000/mcp
    tools:
      include:
        - despensa
        - perfil_ler
        - perfil_gravar
        - perfil_pendente
        - ingrediente_preco
        - prato_salvar
        - prato_checar
        - prato_aceitar
        - cmv
        - cenarios
        - cardapio
      prompts: false
      resources: false
